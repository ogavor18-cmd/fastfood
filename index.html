<!doctype html>
<html lang="uz"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#6c3ff0"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png">
<title>Daftar Do'kon</title>
<style>
:root{--bg:#ebe6fa;--card:#fff;--ink:#1c1b2e;--mute:#6f6c85;--line:#ddd6f4;--pri:#6c3ff0;--pri2:#8b6bff;--prid:#4a22c4;--soft:#f3effd;--red:#e0343c;--red2:#f0535a;--redd:#951a20;--ok:#17a34a;--sh:0 14px 30px rgba(108,63,240,.13)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17132a;--card:#241f3d;--ink:#f1eefc;--mute:#a49fc4;--line:#352f56;--soft:#2d2750;--sh:0 14px 30px rgba(0,0,0,.35)}}
:root[data-theme="dark"]{--bg:#17132a;--card:#241f3d;--ink:#f1eefc;--mute:#a49fc4;--line:#352f56;--soft:#2d2750;--sh:0 14px 30px rgba(0,0,0,.35)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:Roboto,system-ui,-apple-system,"Segoe UI",sans-serif}
[hidden]{display:none!important}
button,input,select{font:inherit;color:inherit}
button{border:0;background:none;cursor:pointer}
#app{max-width:560px;margin:0 auto;padding:18px 16px calc(120px + env(safe-area-inset-bottom,0px));min-height:100vh}
header.top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap;margin:6px 4px 14px}
h1{margin:0;font-size:30px;font-weight:800;letter-spacing:-.3px}
.sub{color:var(--mute);font-size:17px;margin-top:2px}
.hb{display:flex;gap:6px}
.pbtn,.rbtn,.big{color:#fff;font-weight:800;border-radius:18px;padding:13px 18px;font-size:16px;transition:transform .08s}
.pbtn:active,.rbtn:active,.big:active{transform:translateY(3px)}
.pbtn,.big{background:linear-gradient(180deg,var(--pri2),var(--pri));box-shadow:0 5px 0 var(--prid),0 10px 18px rgba(108,63,240,.3)}
.rbtn{background:linear-gradient(180deg,var(--red2),var(--red));box-shadow:0 5px 0 var(--redd),0 10px 18px rgba(224,52,60,.3);padding:13px 15px}
.rbtn svg{display:block}
.big{width:100%;padding:17px;font-size:19px;margin-top:6px}
.ghost{background:var(--soft);color:var(--pri);font-weight:800;border-radius:14px;padding:11px 14px}
.card{background:var(--card);border-radius:30px;padding:20px;box-shadow:var(--sh);margin-bottom:16px}
.card h2{margin:0 0 10px;font-size:21px}
.empty{color:var(--mute);text-align:center;padding:26px 8px;font-size:17px;line-height:1.4}
.note{color:var(--mute);font-size:16px;line-height:1.45;margin:4px 6px 14px}
input[type=text],input[type=password],input[type=number],input[type=tel],select{width:100%;padding:16px;border-radius:18px;border:2px solid var(--line);background:var(--card);font-size:18px;margin-bottom:12px;outline:none}
input:focus,select:focus{border-color:var(--pri)}
label.l{display:block;font-weight:700;color:var(--mute);margin:0 0 6px 4px;font-size:14px}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:0;margin-bottom:14px;background:var(--soft);border-radius:20px}
.seg button{padding:15px;border-radius:20px;font-weight:800;font-size:18px;color:var(--mute)}
.seg button.on{background:linear-gradient(180deg,var(--pri2),var(--pri));color:#fff;box-shadow:0 5px 0 var(--prid)}
.err{color:var(--red);font-weight:700;min-height:20px;margin:0 4px 6px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px}
.stat{background:var(--card);padding:20px 18px;box-shadow:var(--sh)}
.stat:nth-child(1){border-radius:30px 44px 44px 30px/34px 20px 46px 36px;transform:rotate(-.7deg)}
.stat:nth-child(2){border-radius:44px 30px 30px 44px/22px 36px 34px 44px;transform:rotate(.7deg)}
.stat small{color:var(--mute);font-size:17px}.stat b{display:block;font-size:30px;margin-top:6px}
.chart{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;align-items:end;height:190px;margin-top:8px}
.bar{display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;font-size:14px;color:var(--mute)}
.bar i{display:block;width:100%;min-height:4px;border-radius:8px;background:linear-gradient(180deg,var(--pri2),var(--pri));margin-bottom:6px;transition:height .6s cubic-bezier(.2,.9,.3,1)}
.bar.t i{background:linear-gradient(180deg,#ffb74d,#f57c00)}
.bar em{font-style:normal;font-size:11px;margin-bottom:3px}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 0;border-top:1px solid var(--line)}
.row:first-of-type{border-top:0}
.row b{font-size:17px}.row small{display:block;color:var(--mute);font-size:14px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 12px;margin:0 -4px}
.chip{flex:none;padding:11px 18px;border-radius:16px;background:var(--card);font-weight:800;color:var(--mute);box-shadow:0 3px 8px rgba(108,63,240,.08)}
.chip.on{background:linear-gradient(180deg,var(--pri2),var(--pri));color:#fff;box-shadow:0 4px 0 var(--prid)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.pc{background:var(--card);border-radius:26px;padding:14px 10px 14px;box-shadow:var(--sh);text-align:center;position:relative;width:100%}
.pc .im{width:84px;height:84px;margin:0 auto 6px;display:block}
.pc b{display:block;font-size:17px;overflow-wrap:anywhere}.pc span{color:var(--ok);font-weight:800}
.pc small{display:block;color:var(--mute);margin-top:2px}
.pc:active{transform:scale(.97)}
.qb{position:absolute;top:8px;right:8px;display:flex;align-items:center;gap:4px}
.qb span{background:var(--pri);color:#fff;border-radius:12px;padding:3px 10px;font-weight:800}
.qb i{font-style:normal;background:var(--red);color:#fff;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-weight:800}
nav.bar2{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(12px + env(safe-area-inset-bottom,0px));width:calc(100% - 24px);max-width:536px;background:var(--card);border-radius:34px;padding:10px 6px;display:grid;grid-template-columns:repeat(4,1fr);box-shadow:0 10px 36px rgba(60,30,140,.28);z-index:5}
nav.bar2 button{display:grid;justify-items:center;gap:2px;color:var(--mute);font-size:14px;padding:4px 0;position:relative}
nav.bar2 .dot{position:absolute;top:-2px;right:calc(50% - 26px);background:var(--red);color:#fff;font-style:normal;font-size:12px;font-weight:800;min-width:20px;height:20px;border-radius:10px;display:grid;place-items:center;padding:0 5px}
nav.bar2 .e{font-size:30px;line-height:1.1;filter:grayscale(.5);opacity:.75;transition:transform .2s}
nav.bar2 button.on{color:var(--pri);font-weight:800}nav.bar2 button.on .e{filter:none;opacity:1;transform:translateY(-3px) scale(1.12)}
.cartbar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(112px + env(safe-area-inset-bottom,0px));width:calc(100% - 24px);max-width:536px;z-index:5}
.cartbar .big{margin:0;display:flex;justify-content:space-between;align-items:center}
.scrim{position:fixed;top:0;right:0;bottom:0;left:0;background:rgba(20,10,50,.5);z-index:20;animation:fi .2s}
.sheet{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:100%;max-width:560px;max-height:90vh;overflow:auto;background:var(--card);border-radius:34px 34px 0 0;padding:20px 18px calc(24px + env(safe-area-inset-bottom,0px));z-index:21;animation:up .28s cubic-bezier(.2,.9,.3,1)}
.sheet h3{margin:0 0 14px;font-size:23px}
.picker{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:14px}
.picker label{border:3px solid transparent;border-radius:16px;background:var(--soft);padding:6px;display:grid;justify-items:center;font-size:12px;color:var(--mute);cursor:pointer}
.picker input{display:none}.picker input:checked+div{outline:3px solid var(--pri);outline-offset:3px;border-radius:12px}
.picker svg{width:100%;max-width:56px;height:auto}
.qty{display:flex;align-items:center;gap:10px}
.qty button{width:36px;height:36px;border-radius:12px;background:var(--soft);color:var(--pri);font-weight:800;font-size:20px}
.pc.out{opacity:.6}.pc .tg{position:absolute;left:8px;right:8px;top:30px;background:var(--red);color:#fff;font-weight:800;border-radius:12px;padding:6px 4px;transform:rotate(-8deg);box-shadow:0 6px 14px rgba(224,52,60,.4)}
.chip2{display:inline-block;border-radius:12px;padding:5px 11px;font-weight:800;font-size:14px}.ok2{background:rgba(23,163,74,.14);color:var(--ok)}.lo2{background:rgba(245,158,11,.18);color:#c77700}.no2{background:rgba(224,52,60,.14);color:var(--red)}.na2{background:var(--soft);color:var(--mute)}
.toast{position:fixed;left:50%;top:70px;transform:translateX(-50%);background:#1c1b2e;color:#fff;padding:13px 20px;border-radius:18px;z-index:40;font-weight:700;box-shadow:0 10px 30px rgba(0,0,0,.35);animation:drop .35s cubic-bezier(.2,.9,.3,1);max-width:90%;text-align:center}
.mini{font-size:13px;padding:8px 12px;border-radius:12px}
.dng{color:var(--red);background:rgba(224,52,60,.1)}
@keyframes fi{from{opacity:0}}@keyframes up{from{transform:translate(-50%,100%)}}@keyframes drop{from{opacity:0;transform:translate(-50%,-20px)}}
.rise{animation:rise .7s cubic-bezier(.2,.9,.3,1) both}
@keyframes rise{from{opacity:0;transform:translateY(40px) scale(.96)}}
/* splash */
#splash{position:fixed;top:0;right:0;bottom:0;left:0;z-index:60;background:linear-gradient(160deg,#7b52ff,#5a2ee0 60%,#3d1aa8);display:grid;place-items:center;color:#fff;text-align:center;transition:opacity .5s,visibility .5s}
#splash.out{opacity:0;visibility:hidden}
#splash .ic{display:flex;gap:6px;justify-content:center;margin-bottom:16px}
#splash .ic img{width:190px;height:190px;opacity:0;animation:drp .9s .15s cubic-bezier(.3,1.6,.5,1) forwards;filter:drop-shadow(0 18px 22px rgba(0,0,0,.4))}
#splash .ic svg:nth-child(1){animation-delay:.15s}#splash .ic svg:nth-child(2){animation-delay:.4s}#splash .ic svg:nth-child(3){animation-delay:.65s}
@keyframes drp{0%{opacity:0;transform:translateY(-160px) rotate(-30deg)}100%{opacity:1;transform:none}}
#splash h2{margin:0;font-size:36px;letter-spacing:.5px;opacity:0;animation:fin .6s 1.1s forwards}
#splash p{margin:6px 0 0;opacity:0;animation:fin .6s 1.4s forwards;color:#d9cdff}
@keyframes fin{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
#welcome{position:fixed;top:0;right:0;bottom:0;left:0;z-index:50;background:rgba(108,63,240,.96);display:grid;place-items:center;color:#fff;text-align:center;animation:fi .25s}
#welcome svg{width:110px;height:110px}
#welcome circle{stroke-dasharray:300;stroke-dashoffset:300;animation:dr .6s .1s forwards}
#welcome path{stroke-dasharray:60;stroke-dashoffset:60;animation:dr .4s .55s forwards}
@keyframes dr{to{stroke-dashoffset:0}}
#welcome h2{margin:14px 0 4px;font-size:28px;animation:fin .5s .5s both}#welcome p{margin:0;color:#e0d6ff;animation:fin .5s .7s both}
.logo{display:block;margin:0 0 8px}.logo img{width:132px;height:132px;display:block;filter:drop-shadow(0 14px 18px rgba(60,20,160,.35));animation:float 3.2s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-8px) rotate(-2deg)}}
</style>
</head><body>

<div id="app"></div>
<div id="layer"></div>

function p2(n){return n<10?"0"+n:""+n}
function dkey(ts){var d=new Date(ts||Date.now());return d.getFullYear()+"-"+p2(d.getMonth()+1)+"-"+p2(d.getDate())}
function hm(ts){var d=new Date(ts);return p2(d.getHours())+":"+p2(d.getMinutes())}
function dmy(k){var a=k.split("-");return a[2]+"."+a[1]+"."+a[0]}
function money(n){return String(Math.round(n)).replace(/\B(?=(\d{3})+(?!\d))/g," ")+" so'm"}
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
function rsalt(){return Math.random().toString(36).slice(2,10)}
function hash(pw,salt){
  var s=salt+":"+pw;
  if(window.crypto&&crypto.subtle&&window.TextEncoder){return crypto.subtle.digest("SHA-256",new TextEncoder().encode(s)).then(function(b){return Array.prototype.map.call(new Uint8Array(b),function(x){return ("0"+x.toString(16)).slice(-2)}).join("")})}
  var h=5381;for(var i=0;i<s.length;i++)h=((h<<5)+h+s.charCodeAt(i))|0;return Promise.resolve("f"+h);
}

function logout(msg){openCat=null;wtab="sell";
  if(SES&&SES.role==="worker"&&DB){var nowT=Date.now(),eod=function(k){var a=k.split("-");return new Date(+a[0],+a[1]-1,+a[2]+1).getTime()-1000};for(var i=0;i<DB.shifts.length;i++){var s=DB.shifts[i];if(s.wid===SES.id&&!s.end){s.end=(s.date!==dkey(nowT))?Math.max(s.start,Math.min(s.last||eod(s.date),eod(s.date))):nowT}}save()}

}

function shiftsOf(wid,k){return DB.shifts.filter(function(x){return x.wid===wid&&x.date===k}).sort(function(a,b){return a.start-b.start})}

  else h+=backBtn()+'<div class="grid">'+prodList().map(function(p){var q=cart[p.id]||0;var out=tracked(p)&&p.stock<=0;return '<div class="pc'+(out?" out":"")+'" data-act="add" data-id="'+p.id+'" role="button" tabindex="0">'+(out?'<div class="tg">Tugadi</div>':"")+(q?'<div class="qb"><span>'+q+'</span><i data-act="sub" data-id="'+p.id+'">−</i></div>':"")+svg(p.img)+"<b>"+esc(p.name)+"</b><span>"+money(p.price)+"</span></div>"}).join("")+"</div>";
  var c=cartInfo();
  if(c.n)h+='<div class="cartbar"><button class="big" data-act="cart"><span>🛒 '+c.n+' ta</span><span>'+money(c.t)+" →</span></button></div>";
  return h;
}
function cartSheet(){
  var c=cartInfo(),ids=Object.keys(cart).filter(function(id){return prod(id)});
  if(!ids.length){closeSheet();return}
  var h=ids.map(function(id){var p=prod(id);return '<div class="row"><div style="display:flex;align-items:center;gap:10px">'+svg(p.img,"").replace("<svg",'<svg width="44" height="44"')+"<div><b>"+esc(p.name)+"</b><small>"+money(p.price)+'</small></div></div><div class="qty"><button data-act="csub" data-id="'+id+'">−</button><b>'+cart[id]+'</b><button data-act="cadd" data-id="'+id+'">+</button></div></div>'}).join("");
  h+='<form data-form="sell" style="margin-top:14px">'+(DB.custs.length?'<label class="l">Mijoz (ixtiyoriy)</label><select name="cust"><option value="">— Mijoz tanlanmagan —</option>'+DB.custs.map(function(x){return '<option value="'+x.id+'">'+esc(x.name)+"</option>"}).join("")+"</select>":"")+'<div class="row" style="border:0"><b style="font-size:20px">Jami</b><b style="font-size:22px;color:var(--ok)">'+money(c.t)+'</b></div><button class="big" type="submit">✓ Sotish</button><button type="button" class="ghost" style="width:100%;margin-top:10px" data-act="clearcart">Savatni tozalash</button></form>';
  sheet("Savat",h);
}

function nav(){var t=[["shop","🛍️","Do'kon"],["rep","📊","Hisobot"],["cust","👥","Mijozlar"],["stock","📦","Ombor"],["work","🧑‍💼","Ishchilar"]];var oc=outCount();return '<nav class="bar2" style="grid-template-columns:repeat(5,1fr)">'+t.map(function(x){return '<button data-act="tab" data-v="'+x[0]+'" class="'+(tab===x[0]?"on":"")+'"><span class="e">'+x[1]+"</span>"+x[2]+(x[0]==="stock"&&oc?'<i class="dot">'+oc+"</i>":"")+"</button>"}).join("")+"</nav>"}

  var m=me();

  app.innerHTML=({shop:shopView,rep:reportView,cust:custView,stock:stockView,work:workView}[tab])()+nav();

function err(t){var e=$("#fe")||$(".err");if(e)e.textContent=t}

/* ---------- Hodisalar ---------- */
document.addEventListener("click",function(e){
  var el=e.target.closest("[data-act]");if(!el)return;var a=el.dataset.act,id=el.dataset.id,v=el.dataset.v;
  if(a==="sub"){e.stopPropagation();if(cart[id]>1)cart[id]--;else delete cart[id];render();return}
  switch(a){
    case "close":closeSheet();break;
    case "lt":ltab=v;lerr="";llog="";render();break;
    case "tab":tab=v;openCat=null;render();window.scrollTo(0,0);break;
    case "opencat":openCat=id;render();window.scrollTo(0,0);break;
    case "back":openCat=null;render();break;
    case "wtab":wtab=v;openCat=null;render();window.scrollTo(0,0);break;
    case "logout":logout("");break;
    case "newcat":catSheet();break;
    case "newprod":prodSheet(null);break;
    case "editprod":prodSheet(prod(id));break;
    case "delcat":if(confirm("Bo'lim va ichidagi mahsulotlar o'chirilsinmi?")){DB.cats=DB.cats.filter(function(c){return c.id!==id});DB.prods=DB.prods.filter(function(p){return p.cat!==id});if(openCat===id)openCat=null;save();closeSheet();render()}break;
    case "delprod":if(confirm("Mahsulot o'chirilsinmi?")){DB.prods=DB.prods.filter(function(p){return p.id!==id});save();closeSheet();render()}break;
    case "newcust":sheet("Yangi mijoz",'<form data-form="newcust"><input type="text" name="name" placeholder="Ismi" maxlength="30" required autocomplete="off"><input type="tel" name="phone" placeholder="Telefon (ixtiyoriy)" maxlength="20"><button class="big" type="submit">Qo\'shish</button></form>');break;
    case "delcust":if(confirm("Mijoz o'chirilsinmi?")){DB.custs=DB.custs.filter(function(c){return c.id!==id});save();render()}break;
    case "newwork":sheet("Yangi ishchi",'<form data-form="newwork" autocomplete="off"><input type="text" name="name" placeholder="Ishchi ismi" maxlength="30" required><input type="text" name="login" placeholder="Login (harf/raqam)" maxlength="20" autocapitalize="none" required><input type="text" name="pw" placeholder="Parol (kamida 4 belgi)" maxlength="40" required><div class="err" id="fe"></div><button class="big" type="submit">Ishchini qo\'shish</button></form>');break;
    case "pwwork":sheet("Yangi parol",'<form data-form="pwwork" data-id="'+id+'"><input type="text" name="pw" placeholder="Yangi parol (kamida 4 belgi)" maxlength="40" required><div class="err" id="fe"></div><button class="big" type="submit">Saqlash</button></form>');break;
    case "delwork":if(confirm("Ishchi o'chirilsinmi? U endi kira olmaydi.")){DB.workers=DB.workers.filter(function(w){return w.id!==id});save();render()}break;
    case "shifts":DB.workers.forEach(function(w){if(w.id===id)shiftSheet(w)});break;
    case "recv":recvSheet(prod(id));break;
    case "adj":adjSheet(prod(id));break;
    case "add":var pa=prod(id);if(tracked(pa)&&pa.stock-(cart[id]||0)<=0){toast(pa.stock<=0?"❌ "+pa.name+" tugadi":"Omborda faqat "+pa.stock+" ta qoldi");break}cart[id]=(cart[id]||0)+1;render();break;
    case "cart":cartSheet();break;
    case "cadd":var pc=prod(id);if(tracked(pc)&&cart[id]>=pc.stock){toast("Omborda faqat "+pc.stock+" ta qoldi");break}cart[id]++;cartSheet();render();break;
    case "csub":if(cart[id]>1)cart[id]--;else delete cart[id];cartSheet();render();break;
    case "clearcart":cart={};closeSheet();render();break;
  }
});
document.addEventListener("submit",function(e){
  var f=e.target.closest("form[data-form]");if(!f)return;e.preventDefault();
  var k=f.dataset.form,g=function(n){var x=f.elements[n];return x?String(x.value).trim():""};
  if(k==="reg"){
    var shop=g("shop"),lg=g("login").toLowerCase(),pw=g("pw");
    if(!/^[a-z0-9_]{3,20}$/.test(lg)){lerr="Login 3–20 ta harf yoki raqam bo'lsin";render();return}
    if(pw.length<4){lerr="Parol kamida 4 belgi bo'lsin";render();return}
    var salt=rsalt();hash(pw,salt).then(function(hh){DB={shop:shop,boss:{login:lg,salt:salt,hash:hh},workers:[],cats:[],prods:[],custs:[],sales:[],shifts:[]};save();SES={role:"boss",date:dkey()};saveS();lerr="";tab="shop";welcome(shop,render)});
  }else if(k==="loginb"){
    var l2=g("login").toLowerCase();hash(g("pw"),DB.boss.salt).then(function(hh){if(l2===DB.boss.login&&hh===DB.boss.hash){SES={role:"boss",date:dkey()};saveS();lerr="";tab="shop";welcome(DB.shop,render)}else{llog=l2;lerr="Login yoki parol noto'g'ri";render()}});
  }else if(k==="loginw"){
    var l3=g("login").toLowerCase(),w=null;DB.workers.forEach(function(x){if(x.login===l3&&x.on!==false)w=x});
    if(!w){llog=l3;lerr="Login yoki parol noto'g'ri";render();return}
    hash(g("pw"),w.salt).then(function(hh){if(hh!==w.hash){llog=l3;lerr="Login yoki parol noto'g'ri";render();return}
      var kk=dkey();
      DB.shifts.forEach(function(x){if(x.wid===w.id&&!x.end)x.end=Math.max(x.start,x.last||x.start)});
      SES={role:"worker",id:w.id,date:kk};saveS();
      DB.shifts.push({id:uid(),wid:w.id,name:w.name,date:kk,start:Date.now(),last:Date.now(),end:0});
      save();lerr="";welcome(w.name,render)});
  }else if(k==="newcat"){
    var n=g("name");if(!n)return;if(DB.cats.some(function(c){return c.name.toLowerCase()===n.toLowerCase()})){err("Bunday bo'lim bor");return}
    var c={id:uid(),name:n,img:(f.querySelector("input[name=img]:checked")||{}).value||"hotdog"};DB.cats.push(c);openCat=c.id;save();toast("Bo'lim yaratildi. Endi mahsulot qo'shing");render();prodSheet(null);
  }else if(k==="newprod"||k==="saveprod"){
    var nm=g("name"),pr=Number(g("price")),ct=g("cat"),im=(f.querySelector("input[name=img]:checked")||{}).value||"lavash";
    if(!nm||!(pr>=0)||g("price")===""){err("Nomi va narxini kiriting");return}
    var stv=g("stock"),pkv=Math.max(0,Math.round(Number(g("pack"))||0));
    if(k==="newprod"){var np={id:uid(),cat:ct,name:nm,price:Math.round(pr),img:im,pack:pkv};if(stv!=="")np.stock=Math.max(0,Math.round(Number(stv)));DB.prods.push(np);openCat=ct;toast("Mahsulot qo'shildi")}
    else{var p=prod(f.dataset.id);if(p){p.cat=ct;p.name=nm;p.price=Math.round(pr);p.img=im;p.pack=pkv;if(stv!=="")p.stock=Math.max(0,Math.round(Number(stv)));else delete p.stock}toast("Saqlandi")}
    save();closeSheet();render();
  }else if(k==="newcust"){DB.custs.push({id:uid(),name:g("name"),phone:g("phone")});save();closeSheet();render()}
  else if(k==="newwork"){
    var wl=g("login").toLowerCase(),wp=g("pw");
    if(!/^[a-z0-9_]{3,20}$/.test(wl)){err("Login 3–20 ta harf yoki raqam bo'lsin");return}
    if(wl===DB.boss.login||DB.workers.some(function(x){return x.login===wl})){err("Bu login band");return}
    if(wp.length<4){err("Parol kamida 4 belgi");return}
    var ws=rsalt();hash(wp,ws).then(function(hh){DB.workers.push({id:uid(),name:g("name"),login:wl,salt:ws,hash:hh,on:true});save();closeSheet();toast("Ishchi qo'shildi");render()});
  }else if(k==="pwwork"){
    var np=g("pw");if(np.length<4){err("Parol kamida 4 belgi");return}
    var wk=null;DB.workers.forEach(function(x){if(x.id===f.dataset.id)wk=x});if(!wk)return;
    var s2=rsalt();hash(np,s2).then(function(hh){wk.salt=s2;wk.hash=hh;save();closeSheet();toast("Parol o'zgardi")});
  }else if(k==="recv"){
    var rp=prod(f.dataset.id);if(!rp)return;var bl=Math.round(Number(g("blok"))||0),dn=Math.round(Number(g("dona"))||0),qt=bl*(rp.pack||0)+dn;
    if(!(qt>0)){err("Miqdorni kiriting");return}
    rp.stock=(tracked(rp)?rp.stock:0)+qt;DB.moves=DB.moves||[];DB.moves.push({id:uid(),pid:rp.id,name:rp.name,qty:qt,ts:Date.now()});
    save();closeSheet();toast("✓ "+rp.name+": +"+qt+" ta. Omborda: "+rp.stock);render();
  }else if(k==="adj"){
    var ap=prod(f.dataset.id);if(!ap)return;var sv=Math.round(Number(g("stock")));if(!(sv>=0)){err("Sonni kiriting");return}
    ap.stock=sv;ap.pack=Math.max(0,Math.round(Number(g("pack"))||0));save();closeSheet();toast("Saqlandi");render();
  }else if(k==="sell"){
    var bad=false;Object.keys(cart).forEach(function(id){var q=prod(id);if(q&&tracked(q)&&cart[id]>q.stock){bad=true;toast(q.stock<=0?"❌ "+q.name+" tugadi":q.name+": omborda faqat "+q.stock+" ta qoldi");if(q.stock>0)cart[id]=q.stock;else delete cart[id]}});
    if(bad){cartSheet();render();return}
    var items=[],tot=0;Object.keys(cart).forEach(function(id){var p=prod(id);if(p){items.push({pid:id,name:p.name,price:p.price,qty:cart[id]});tot+=p.price*cart[id]}});
    if(!items.length)return;var cid=g("cust"),cn="";DB.custs.forEach(function(x){if(x.id===cid)cn=x.name});
    var m=me();items.forEach(function(it){var q=prod(it.pid);if(tracked(q))q.stock=Math.max(0,q.stock-it.qty)});DB.sales.push({id:uid(),ts:Date.now(),items:items,total:tot,wid:SES.id,wname:m.name,cid:cid||"",cust:cn});
    save();cart={};closeSheet();toast("✓ Sotildi: "+money(tot));render();
  }
});
